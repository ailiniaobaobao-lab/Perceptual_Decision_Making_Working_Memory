<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDM-WM test trial</title>

  <script src="https://unpkg.com/jspsych@8.2.3"></script>
  <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@2.0.0"></script>

  <style>
    body {
      background: white;
    }

    .subject-wrap {
      max-width: 700px;
      margin: 120px auto;
      text-align: center;
      font-size: 24px;
      line-height: 1.6;
    }

    .subject-input {
      font-size: 28px;
      padding: 10px 14px;
      width: 260px;
      text-align: center;
      margin-top: 16px;
    }

    .subject-btn {
      font-size: 22px;
      padding: 10px 22px;
      margin-top: 20px;
      cursor: pointer;
    }

    .error-text {
      color: #b00020;
      margin-top: 12px;
      font-size: 18px;
      min-height: 24px;
    }

    .task-wrap {
      margin: 0 auto;
      text-align: center;
    }

    .question-title {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 600;
      min-height: 34px;
    }

    .question-subtitle {
      font-size: 18px;
      margin-bottom: 20px;
      color: #444;
      min-height: 22px;
    }

    .pentagon-area {
      margin: 0 auto;
      position: relative;
    }

    .option-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    .option-btn.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .option-btn svg {
      overflow: visible;
      display: block;
      margin: 0;
    }

    .fixation {
      font-size: 64px;
      font-weight: 600;
    }

    .confidence-wrap {
      width: 800px;
      margin: 100px auto 0 auto;
      text-align: center;
    }

    .confidence-title {
      font-size: 30px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .confidence-subtitle {
      font-size: 18px;
      margin-bottom: 35px;
      color: #444;
    }

    .confidence-buttons {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 20px;
    }

    .conf-btn {
      width: 90px;
      height: 90px;
      font-size: 32px;
      border-radius: 14px;
      border: 2px solid #222;
      background: white;
      cursor: pointer;
    }

    .confidence-anchor-row {
      width: 520px;
      margin: 14px auto 0 auto;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: #555;
    }

    .feedback-wrap {
      width: 800px;
      margin: 140px auto 0 auto;
      text-align: center;
    }

    .feedback-title {
      font-size: 44px;
      font-weight: 700;
      color: #178f3c;
      line-height: 1.1;
    }

    .feedback-title.incorrect {
      color: #b00020;
    }

    .feedback-points {
      margin-top: 10px;
      font-size: 30px;
      font-weight: 600;
      color: #178f3c;
      line-height: 1.1;
    }
  </style>
</head>
<body></body>

<script>
  const CONFIG = {
    nOptions: 5,
    fixationDuration: 700,
    correctFeedbackDuration: 900,
    stimulusRadius: 52,
    svgSize: 120,
    maxDotCount: 100
  };

  const DISPLAY = {
    areaWidthPx: 1000,
    areaHeightPx: 700,
    buttonSizePx: 170,
    displayedSvgSizePx: 150,
    centersPx: [
      { x: 500, y: 95 },
      { x: 220, y: 300 },
      { x: 780, y: 300 },
      { x: 325, y: 590 },
      { x: 675, y: 590 }
    ]
  };

  const experimentState = {
    subjectID: "",
    completionCode: "",
    totalPoints: 0
  };

  let experimentSavePromise = null;
  let experimentSaved = false;

  const trialState = {
    currentTrial: null,
    available: [],
    choiceNumber: 0,
    trialStartTime: null,
    choiceScreenStartTime: null,
    confidenceScreenStartTime: null,
    lastChoice: null,
    lastChoiceCorrect: null,
    lastChoiceRT: null,
    lastPointsAwarded: 0
  };

  const jsPsych = initJsPsych({
    on_finish: function() {
      saveExperimentData().catch(error => {
        console.error("Could not save test data to server:", error);
      });
    }
  });

  function buildExperimentCSV() {
    const raw = jsPsych.data.get().values();

    const cleaned = raw.map(row => ({
      subject_id: experimentState.subjectID || null,
      completion_code: experimentState.completionCode,
      pixels_per_mm: row.pixels_per_mm ?? null,
      mm_per_px: row.mm_per_px ?? null,
      viewing_distance_mm: row.viewing_distance_mm ?? null,
      event: row.event ?? null,
      experiment_elapsed_ms: row.time_elapsed ?? row.system_event_time_ms ?? null,
      experiment_elapsed_min:
        row.time_elapsed !== undefined && row.time_elapsed !== null
          ? (row.time_elapsed / 60000).toFixed(3)
          : row.system_event_time_ms !== undefined && row.system_event_time_ms !== null
            ? (row.system_event_time_ms / 60000).toFixed(3)
            : null,
      rt: row.rt ?? null,
      trial_index: row.trial_index ?? null,
      practice: row.practice ?? null,
      condition_name: row.condition_name ?? null,
      stimulus_duration: row.stimulus_duration ?? null,
      correct_position: row.correct_position ?? null,
      correct_position_name:
        row.correct_position !== undefined && row.correct_position !== null
          ? positionName(row.correct_position)
          : null,
      dot_counts: row.dot_counts ?? null,
      choice_number: row.choice_number ?? null,
      choice_index: row.choice_index ?? null,
      choice_position_name:
        row.choice_index !== undefined && row.choice_index !== null
          ? positionName(row.choice_index)
          : null,
      elapsed_ms_from_trial_start: row.elapsed_ms_from_trial_start ?? null,
      correct: row.correct ?? null,
      remaining_options_before_choice: row.remaining_options_before_choice ?? null,
      points_awarded: row.points_awarded ?? null,
      total_points: row.total_points ?? null,
      confidence_choice_correct: row.choice_correct ?? null,
      confidence_choice_rt: row.choice_rt ?? null,
      confidence: row.confidence ?? null,
      system_event_time_ms: row.system_event_time_ms ?? null,
      system_event_iso_time: row.system_event_iso_time ?? null,
      window_has_focus: row.window_has_focus ?? null,
      fullscreen_active: row.fullscreen_active ?? null,
      document_visibility_state: row.document_visibility_state ?? null,
      jspsych_interaction_trial: row.jspsych_interaction_trial ?? null,
      fullscreen_reentry_stage: row.fullscreen_reentry_stage ?? null,
      fullscreen_success: row.success ?? null
    }));

    const columns = [
      "subject_id",
      "completion_code",
      "pixels_per_mm",
      "mm_per_px",
      "viewing_distance_mm",
      "event",
      "experiment_elapsed_ms",
      "experiment_elapsed_min",
      "rt",
      "trial_index",
      "practice",
      "condition_name",
      "stimulus_duration",
      "correct_position",
      "correct_position_name",
      "dot_counts",
      "choice_number",
      "choice_index",
      "choice_position_name",
      "elapsed_ms_from_trial_start",
      "correct",
      "remaining_options_before_choice",
      "points_awarded",
      "total_points",
      "confidence_choice_correct",
      "confidence_choice_rt",
      "confidence",
      "system_event_time_ms",
      "system_event_iso_time",
      "window_has_focus",
      "fullscreen_active",
      "document_visibility_state",
      "jspsych_interaction_trial",
      "fullscreen_reentry_stage",
      "fullscreen_success"
    ];

    const escapeCSV = (value) => {
      if (value === null || value === undefined) return "";
      const str = String(value);
      if (str.includes('"') || str.includes(",") || str.includes("\n")) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    };

    const csvLines = [
      columns.join(","),
      ...cleaned.map(row => columns.map(col => escapeCSV(row[col])).join(","))
    ];

    const csv = csvLines.join("\n");
    const safeSubjectID = (experimentState.subjectID || "unknown").replace(/[^\w-]/g, "");
    const filename = `test_p${safeSubjectID}_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;

    return { filename, csv };
  }

  function saveExperimentData() {
    if (experimentSaved) {
      return Promise.resolve("Data already saved.");
    }

    if (experimentSavePromise) {
      return experimentSavePromise;
    }

    const { filename, csv } = buildExperimentCSV();
    experimentSavePromise = saveCSVToServer(filename, csv)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }
        return response.text();
      })
      .then(message => {
        experimentSaved = true;
        console.log(message);
        return message;
      })
      .catch(error => {
        experimentSavePromise = null;
        throw error;
      });

    return experimentSavePromise;
  }

  function saveCSVToServer(filename, text) {
    const formData = new URLSearchParams();
    formData.append("filename", filename);
    formData.append("csvdata", text);

    return fetch("save_data.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formData.toString()
    });
  }

  function positionName(index) {
    const map = {
      0: "top",
      1: "upper_left",
      2: "upper_right",
      3: "lower_left",
      4: "lower_right"
    };
    return map[index] ?? null;
  }

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generateDots(nDots, seed) {
    const rand = mulberry32(seed);
    const points = [];
    const center = CONFIG.svgSize / 2;
    const margin = 10;
    const radius = CONFIG.stimulusRadius - 6;

    let attempts = 0;
    while (points.length < nDots && attempts < nDots * 250) {
      attempts++;
      const x = margin + rand() * (CONFIG.svgSize - 2 * margin);
      const y = margin + rand() * (CONFIG.svgSize - 2 * margin);
      const dx = x - center;
      const dy = y - center;
      if ((dx * dx + dy * dy) > radius * radius) continue;

      let overlaps = false;
      for (const p of points) {
        const ddx = x - p.x;
        const ddy = y - p.y;
        if (ddx * ddx + ddy * ddy < 20) {
          overlaps = true;
          break;
        }
      }
      if (!overlaps) points.push({ x, y });
    }
    return points;
  }

  function makeHardTrial() {
    const dotCounts = shuffle([100, 96, 96, 96, 96]);
    const correctPosition = dotCounts.indexOf(CONFIG.maxDotCount);
    const options = dotCounts.map((nDots, optionIndex) => ({
      nDots,
      points: generateDots(nDots, 100 + optionIndex * 17 + 1)
    }));

    return {
      trialIndex: 1,
      practice: false,
      condition_name: "test_hard_four_same_500ms",
      duration: 500,
      correctPosition,
      options
    };
  }

  const testTrial = makeHardTrial();

  function getOptionStyle(index) {
    const center = DISPLAY.centersPx[index];
    return `
      left: ${center.x}px;
      top: ${center.y}px;
      width: ${DISPLAY.buttonSizePx}px;
      height: ${DISPLAY.buttonSizePx}px;
    `;
  }

  function getPointsForAttempt(attemptNumber) {
    const pointsByAttempt = [4, 3, 2, 1, 0];
    return pointsByAttempt[attemptNumber - 1] ?? 0;
  }

  function initializeTrialState(trialConfig) {
    trialState.currentTrial = trialConfig;
    trialState.available = Array(CONFIG.nOptions).fill(true);
    trialState.choiceNumber = 0;
    trialState.trialStartTime = performance.now();
    trialState.choiceScreenStartTime = null;
    trialState.confidenceScreenStartTime = null;
    trialState.lastChoice = null;
    trialState.lastChoiceCorrect = null;
    trialState.lastChoiceRT = null;
    trialState.lastPointsAwarded = 0;
  }

  function renderOptionSVG(option, showDots = true) {
    const center = CONFIG.svgSize / 2;
    const radius = CONFIG.stimulusRadius;
    const outline = `
      <circle cx="${center}" cy="${center}" r="${radius}"
        fill="white" stroke="black" stroke-width="3"></circle>
    `;
    const dots = showDots
      ? option.points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="black"></circle>`).join("")
      : "";

    return `
      <svg width="${DISPLAY.displayedSvgSizePx}" height="${DISPLAY.displayedSvgSizePx}" viewBox="0 0 ${CONFIG.svgSize} ${CONFIG.svgSize}">
        ${outline}
        ${dots}
      </svg>
    `;
  }

  function renderTaskDisplayFrame(optionHTML, titleText, subtitleText) {
    return `
      <div class="task-wrap" style="width:${DISPLAY.areaWidthPx}px;">
        <div class="question-title">${titleText}</div>
        <div class="question-subtitle">${subtitleText}</div>
        <div class="pentagon-area" style="width:${DISPLAY.areaWidthPx}px; height:${DISPLAY.areaHeightPx}px;">
          ${optionHTML}
        </div>
      </div>
    `;
  }

  function renderStimulusDisplay(trialConfig) {
    const optionHTML = trialConfig.options.map((opt, idx) => {
      return `
        <div class="option-btn" style="${getOptionStyle(idx)} cursor: default;">
          ${renderOptionSVG(opt, true)}
        </div>
      `;
    }).join("");

    return renderTaskDisplayFrame(optionHTML, "Which circle has the most dots?", "Look carefully.");
  }

  function renderChoiceDisplay() {
    const trialConfig = trialState.currentTrial;
    const optionHTML = trialConfig.options.map((opt, idx) => {
      const hiddenClass = trialState.available[idx] ? "" : "hidden";
      return `
        <div class="option-btn choice-option ${hiddenClass}" style="${getOptionStyle(idx)}"
             data-index="${idx}"
             role="button"
             tabindex="0"
             aria-label="option ${idx + 1}">
          ${renderOptionSVG(opt, false)}
        </div>
      `;
    }).join("");

    return renderTaskDisplayFrame(optionHTML, "Which circle has the most dots?", "Look carefully.");
  }

  function renderConfidenceDisplay() {
    return `
      <div class="confidence-wrap">
        <div class="confidence-title">How confident are you?</div>
        <div class="confidence-subtitle">
          Confidence for choice ${trialState.choiceNumber}
        </div>
        <div class="confidence-buttons">
          <button class="conf-btn confidence-btn" data-conf="1">1</button>
          <button class="conf-btn confidence-btn" data-conf="2">2</button>
          <button class="conf-btn confidence-btn" data-conf="3">3</button>
          <button class="conf-btn confidence-btn" data-conf="4">4</button>
        </div>
        <div class="confidence-anchor-row">
          <div>Not confident</div>
          <div>Very confident</div>
        </div>
      </div>
    `;
  }

  function renderTrialFeedback() {
    const wasCorrect = trialState.lastChoiceCorrect;
    const pointsLine = wasCorrect && trialState.lastPointsAwarded > 0
      ? `<div class="feedback-points">+${trialState.lastPointsAwarded} points</div>`
      : "";
    const feedbackClass = wasCorrect ? "feedback-title" : "feedback-title incorrect";
    const feedbackText = wasCorrect ? "CORRECT!" : "INCORRECT!";

    return `
      <div class="feedback-wrap">
        <div class="${feedbackClass}">${feedbackText}</div>
        ${pointsLine}
      </div>
    `;
  }

  function makeTrialTimeline(trialConfig) {
    const initTrial = {
      type: jsPsychCallFunction,
      func: function() {
        initializeTrialState(trialConfig);
      },
      data: {
        event: "initialize_trial",
        trial_index: trialConfig.trialIndex,
        practice: trialConfig.practice,
        condition_name: trialConfig.condition_name,
        stimulus_duration: trialConfig.duration,
        correct_position: trialConfig.correctPosition
      }
    };

    const fixation = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `<div class="fixation">+</div>`,
      choices: "NO_KEYS",
      trial_duration: CONFIG.fixationDuration,
      data: {
        event: "fixation",
        trial_index: trialConfig.trialIndex,
        practice: trialConfig.practice,
        condition_name: trialConfig.condition_name,
        stimulus_duration: trialConfig.duration,
        correct_position: trialConfig.correctPosition
      }
    };

    const stimulus = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        return renderStimulusDisplay(trialConfig);
      },
      choices: "NO_KEYS",
      trial_duration: trialConfig.duration,
      data: {
        event: "stimulus",
        trial_index: trialConfig.trialIndex,
        practice: trialConfig.practice,
        condition_name: trialConfig.condition_name,
        stimulus_duration: trialConfig.duration,
        correct_position: trialConfig.correctPosition,
        dot_counts: JSON.stringify(trialConfig.options.map(x => x.nDots))
      }
    };

    const choice = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        return renderChoiceDisplay();
      },
      choices: "NO_KEYS",
      on_load: function() {
        trialState.choiceScreenStartTime = performance.now();
        const clickable = document.querySelectorAll(".choice-option:not(.hidden)");
        clickable.forEach(btn => {
          btn.addEventListener("click", function() {
            const selectedIndex = parseInt(this.dataset.index, 10);
            const rt = Math.round(performance.now() - trialState.choiceScreenStartTime);
            const elapsedMs = Math.round(performance.now() - trialState.trialStartTime);
            const correct = selectedIndex === trialState.currentTrial.correctPosition;
            jsPsych.finishTrial({
              event: "choice",
              subject_id: experimentState.subjectID,
              trial_index: trialState.currentTrial.trialIndex,
              practice: trialState.currentTrial.practice,
              condition_name: trialState.currentTrial.condition_name,
              stimulus_duration: trialState.currentTrial.duration,
              correct_position: trialState.currentTrial.correctPosition,
              choice_number: trialState.choiceNumber + 1,
              choice_index: selectedIndex,
              rt,
              elapsed_ms_from_trial_start: elapsedMs,
              correct,
              remaining_options_before_choice: trialState.available.filter(x => x).length
            });
          });
        });
      },
      on_finish: function(data) {
        trialState.choiceNumber += 1;
        trialState.lastChoice = data.choice_index;
        trialState.lastChoiceCorrect = data.correct;
        trialState.lastChoiceRT = data.rt;
        trialState.lastPointsAwarded = data.correct ? getPointsForAttempt(data.choice_number) : 0;
        if (!data.correct) {
          trialState.available[data.choice_index] = false;
        }
      }
    };

    const confidence = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        return renderConfidenceDisplay();
      },
      choices: "NO_KEYS",
      on_load: function() {
        trialState.confidenceScreenStartTime = performance.now();
        const buttons = document.querySelectorAll(".confidence-btn");
        buttons.forEach(btn => {
          btn.addEventListener("click", function() {
            const conf = parseInt(this.dataset.conf, 10);
            const rt = Math.round(performance.now() - trialState.confidenceScreenStartTime);
            jsPsych.finishTrial({
              event: "confidence",
              subject_id: experimentState.subjectID,
              trial_index: trialState.currentTrial.trialIndex,
              practice: trialState.currentTrial.practice,
              condition_name: trialState.currentTrial.condition_name,
              stimulus_duration: trialState.currentTrial.duration,
              correct_position: trialState.currentTrial.correctPosition,
              choice_number: trialState.choiceNumber,
              choice_index: trialState.lastChoice,
              choice_correct: trialState.lastChoiceCorrect,
              choice_rt: trialState.lastChoiceRT,
              confidence: conf,
              rt
            });
          });
        });
      }
    };

    const chooseUntilCorrect = {
      timeline: [choice, confidence],
      loop_function: function() {
        return !trialState.lastChoiceCorrect && trialState.choiceNumber < 4;
      }
    };

    const feedback = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        return renderTrialFeedback();
      },
      choices: "NO_KEYS",
      trial_duration: CONFIG.correctFeedbackDuration,
      on_start: function(trial) {
        const pointsAwarded = trialState.lastPointsAwarded;
        experimentState.totalPoints += pointsAwarded;
        trial.data = {
          event: "feedback",
          subject_id: experimentState.subjectID,
          trial_index: trialConfig.trialIndex,
          practice: trialConfig.practice,
          condition_name: trialConfig.condition_name,
          stimulus_duration: trialConfig.duration,
          correct_position: trialConfig.correctPosition,
          points_awarded: pointsAwarded,
          total_points: experimentState.totalPoints,
          correct: trialState.lastChoiceCorrect
        };
      }
    };

    return {
      timeline: [initTrial, fixation, stimulus, chooseUntilCorrect, feedback]
    };
  }

  const timeline = [];

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="subject-wrap">
        <h2>Test ID</h2>
        <p>Please enter an ID before starting.</p>
        <input id="subject-id-input" class="subject-input" type="text" autocomplete="off" />
        <br>
        <button id="subject-id-btn" class="subject-btn">Continue</button>
        <div id="subject-id-error" class="error-text"></div>
      </div>
    `,
    choices: "NO_KEYS",
    on_load: function() {
      const input = document.getElementById("subject-id-input");
      const btn = document.getElementById("subject-id-btn");
      const error = document.getElementById("subject-id-error");
      input.focus();

      function submitID() {
        const value = input.value.trim();
        if (!value) {
          error.textContent = "Please enter an ID.";
          return;
        }
        experimentState.subjectID = value;
        jsPsych.finishTrial({
          event: "subject_id_entry",
          subject_id: value
        });
      }

      btn.addEventListener("click", submitID);
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") submitID();
      });
    }
  });

  timeline.push(makeTrialTimeline(testTrial));

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
      return `
        <div style="max-width:900px; margin:auto; text-align:center; font-size:28px; line-height:1.7;">
          <h2>Finished</h2>
          <p>Test is complete.</p>
          <p>You earned ${experimentState.totalPoints} points.</p>
          <p>Please submit your test responses before closing this window.</p>
          <button id="save-experiment-btn"
            style="font-size:22px; padding:12px 22px; margin-top:12px; border:2px solid #222; border-radius:6px; background:white; cursor:pointer;">
            Submit test responses
          </button>
          <div id="save-experiment-status" style="font-size:20px; min-height:32px; margin-top:18px; color:#222;"></div>
          <p id="save-experiment-close-message" style="display:none;">Test responses have been saved. You may now close this window.</p>
        </div>
      `;
    },
    choices: "NO_KEYS",
    on_load: function() {
      const saveBtn = document.getElementById("save-experiment-btn");
      const status = document.getElementById("save-experiment-status");
      const closeMessage = document.getElementById("save-experiment-close-message");

      function preventCloseUntilSaved(event) {
        if (experimentSaved) return;
        event.preventDefault();
        event.returnValue = "";
      }

      window.addEventListener("beforeunload", preventCloseUntilSaved);

      saveBtn.addEventListener("click", function() {
        saveBtn.disabled = true;
        saveBtn.style.cursor = "not-allowed";
        status.style.color = "#222";
        status.textContent = "Saving test responses. Please do not close this window.";

        saveExperimentData()
          .then(() => {
            status.style.color = "#178f3c";
            status.textContent = "Test responses saved successfully.";
            saveBtn.style.display = "none";
            closeMessage.style.display = "block";
            window.removeEventListener("beforeunload", preventCloseUntilSaved);
          })
          .catch(error => {
            console.error("Could not save test data to server:", error);
            saveBtn.disabled = false;
            saveBtn.style.cursor = "pointer";
            status.style.color = "#b00020";
            status.textContent = "Test responses were not saved. Please try again before closing this window.";
          });
      });
    }
  });

  jsPsych.run(timeline);
</script>
</html>
